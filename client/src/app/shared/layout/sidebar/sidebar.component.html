<aside class="sidebar">
    <div class="sidebar-brand">
        <span class="brand-name">PeopleCore</span>
    </div>

    <nav class="sidebar-nav">
        <div class="nav-section-label">Employee</div>
        @for (item of employeeNavItems; track item.path) {
        <a [routerLink]="item.path" routerLinkActive="active" class="nav-item">
            <span class="material-icons-outlined nav-icon">{{ item.icon }}</span>
            <span class="nav-label">{{ item.label }}</span>
        </a>
        }
    
        @if (isAdmin) {
        <div class="nav-section-label" style="margin-top: 12px;">Admin</div>
        @for (item of adminNavItems; track item.path) {
        <a [routerLink]="item.path" routerLinkActive="active" class="nav-item">
            <span class="material-icons-outlined nav-icon">{{ item.icon }}</span>
            <span class="nav-label">{{ item.label }}</span>
        </a>
        }
        }
    </nav>

    <div class="sidebar-footer">
        <button class="logout-btn" (click)="logout()">
            <span class="material-icons-outlined">logout</span> Sign Out
        </button>
    </div>
</aside>
