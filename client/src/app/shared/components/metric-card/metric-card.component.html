<div class="metric-card" [class]="variant()">
    @if (icon()) {
    <span class="material-icons-outlined metric-icon">{{ icon() }}</span>
    }
    <div class="metric-content">
        <span class="metric-label">{{ label() }}</span>
        <span class="metric-value">{{ value() }}</span>
        @if (subtext()) {
        <span class="metric-subtext" style="font-size: 11px; color: var(--text-muted);">{{ subtext() }}</span>
        }
    </div>
</div>
