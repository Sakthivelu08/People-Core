version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: peoplecore_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: Psiog@123
      MYSQL_DATABASE: peoplecore
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./server/src/scripts/init.sql:/docker-entrypoint-initdb.d/init.sql

  redis:
    image: redis:7-alpine
    container_name: peoplecore_redis
    restart: always
    ports:
      - "6379:6379"

  web1:
    build: ./server
    container_name: peoplecore_web1
    restart: always
    command: npm run dev
    environment:
      - PORT=3000
      - NODE_ENV=development
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=Psiog@123
      - DB_NAME=peoplecore
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - VALIDATE_AZURE_TOKEN=false
    volumes:
      - ./server:/app
      - /app/node_modules
    depends_on:
      - db
      - redis

  web2:
    build: ./server
    container_name: peoplecore_web2
    restart: always
    command: npm run dev
    environment:
      - PORT=3000
      - NODE_ENV=development
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=Psiog@123
      - DB_NAME=peoplecore
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - VALIDATE_AZURE_TOKEN=false
    volumes:
      - ./server:/app
      - /app/node_modules
    depends_on:
      - db
      - redis

  loadbalancer:
    image: nginx:alpine
    container_name: peoplecore_lb
    restart: always
    volumes:
      - ./server/src/config/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:80"
    depends_on:
      - web1
      - web2

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile.dev
    container_name: peoplecore_frontend
    restart: always
    ports:
      - "4200:80"
    volumes:
      - ./client:/app
      - /app/node_modules
    depends_on:
      - loadbalancer

volumes:
  mysql_data:
